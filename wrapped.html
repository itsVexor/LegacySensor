<style>

.top{position:fixed;top:16px;left:16px;z-index:5;color:#fff9;font-size:11px;font-weight:900;letter-spacing:.16em;text-transform:uppercase}.card{cursor:pointer;touch-action:manipulation;width:min(650px,100%);min-height:min(670px,75svh);border:1px solid #ffffff24;border-radius:30px;padding:clamp(24px,6vw,52px);background:linear-gradient(145deg,#ffffff17,#ffffff06);backdrop-filter:blur(18px);box-shadow:0 30px 100px #0006;position:relative;overflow:hidden;animation:enter .65s cubic-bezier(.2,.8,.2,1)}.eyebrow{font-size:11px;font-weight:950;letter-spacing:.22em;color:#ffd5ef;text-transform:uppercase}.big{font-size:clamp(46px,11vw,94px);line-height:.92;letter-spacing:-.07em;font-weight:1000;margin:18px 0 20px;overflow-wrap:anywhere}.gradient{background:linear-gradient(110deg,#fff 5%,#ff8bd1 40%,#8cefff 90%);color:transparent;background-clip:text}.desc{font-size:clamp(15px,3vw,19px);line-height:1.55;color:#ffffffc9;max-width:480px}.stat{font-size:clamp(56px,15vw,112px);font-weight:1000;line-height:1;letter-spacing:-.07em;margin:28px 0 12px}.pill{display:inline-flex;border:1px solid #ffffff36;border-radius:999px;padding:9px 13px;font-size:12px;font-weight:850;color:#fff}.coach{position:absolute;right:0;bottom:0;width:min(43%,270px);max-height:66%;object-fit:contain;object-position:bottom right;filter:drop-shadow(0 0 14px #8a4cff88) drop-shadow(0 10px 24px #0008);pointer-events:none;animation:coachIn .7s cubic-bezier(.2,.8,.2,1) both}.coach-halo{position:absolute;right:4%;bottom:7%;width:32%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#ff2d9a55,transparent 68%);filter:blur(12px);pointer-events:none}@keyframes coachIn{from{opacity:0;transform:translate(24px,18px) scale(.9)}to{opacity:1;transform:none}}.content{position:relative;z-index:1;max-width:75%}.cover-logo{width:72px;height:72px;object-fit:contain;margin-bottom:20px}.controls{position:fixed;bottom:0;left:0;right:0;z-index:10;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;padding:14px 12px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#10071ef2 28%)}button,.back{border:1px solid #ffffff30;background:#ffffff12;color:white;border-radius:999px;padding:12px 17px;font-weight:900;cursor:pointer;text-decoration:none;font-size:12px;transition:transform .2s,background .2s}button:hover,.back:hover{transform:translateY(-2px);background:#ffffff26}.primary{background:linear-gradient(110deg,#ff2d9a,#823cff);border:0}.progress{position:fixed;bottom:76px;left:18px;right:18px;height:3px;background:#ffffff22;border-radius:9px;z-index:8;overflow:hidden}.progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff2d9a,#46e8ff);transition:width .4s}.music{position:fixed;left:16px;top:48px;z-index:5;display:flex;align-items:center;gap:8px;font-size:10px;color:#ffffffa8;max-width:60vw}.bars{display:flex;gap:2px;align-items:end;height:13px}.bars i{width:3px;background:#ff73c4;border-radius:3px;animation:pulse .5s infinite alternate;height:55%}.bars i:nth-child(2){animation-delay:.2s;height:100%}.bars i:nth-child(3){animation-delay:.35s;height:35%}.note{font-size:11px;color:#ffffff88;margin-top:20px}.hidden{display:none!important}

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const MUSIC=[
"ADÉLA - Ain't In LA.mp3","Ariana Grande - Everyday (Official Video) ft. Future.mp3","Jax Jones - Breathe ft. Ina Wroldsen.mp3","Jax Jones - Instruction ft. Demi Lovato, Stefflon Don.mp3","Katy Perry - Chained To The Rhythm (Official) ft. Skip Marley.mp3","Nicki Minaj - Beez In The Trap (Explicit) ft. 2 Chainz.mp3","PINKY UP MV (Choreography Ver.) KATSEYE.mp3","Sigala, Paloma Faith - Lullaby.mp3","Tiësto, Jonas Blue & Rita Ora - Ritual (Official Video).mp3","Zara Larsson - Midnight Sun (Official Music Video).mp3"
];
const COACHES=["assets/coaches/Aboutthatbass_coach_1_big.png","assets/coaches/Animalsalt_coach_1_big.png","assets/coaches/coachesLarge__HotToGo_Coach_1.png","assets/coaches/coachesLarge__StrongerBS_Coach_1.png","assets/coaches/Gibberish_coach_1_big.png","assets/coaches/Luhyapapidlc_coach_1_big.png","assets/coaches/Sucker_coach_1.png","assets/coaches/Whatyouwait_coach_12x.png","assets/coaches/coachesLarge__Wannabe2027_Coach_2.png","assets/coaches/coachesLarge__Wannabe2027_Coach_3.png","assets/coaches/coachesLarge__Wannabe2027_Coach_4.png","assets/coaches/coachesLarge__Wannabe2027_Coach_5.png","assets/coaches/OnaTanczyDlaMnie_Coach_1.png","assets/coaches/Hangover_coach_1_big.PNG","assets/coaches/colorful_special_coach.png"]
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let playlist=shuffle(MUSIC), audioStarted=false, trackToken=0, lastTrack="";
const audio=$("audio");
function randomTrack(){
 if(!playlist.length)playlist=shuffle(MUSIC);
 let track=playlist.pop();
 if(MUSIC.length>1&&track===lastTrack&&playlist.length){playlist.unshift(track);track=playlist.pop();}
 lastTrack=track;return track;
}
function startRandomTrack(){
 if(!MUSIC.length)return;
 const token=++trackToken, track=randomTrack();
 audio.pause();audio.src="assets/wrapped-music/"+encodeURIComponent(track).replace(/%2F/g,"/");audio.load();
 $("musicLabel").lastElementChild.textContent=track.replace(/\.mp3$/i,"");
 const seekAndPlay=()=>{
   if(token!==trackToken)return;
   if(Number.isFinite(audio.duration)&&audio.duration>0){
     // Start somewhere in the track but leave enough runway that it will not end immediately.
     const maxStart=Math.max(0,audio.duration-75);
     const minStart=Math.min(12,maxStart);
     audio.currentTime=minStart+Math.random()*Math.max(0,maxStart-minStart);
   }
   audio.volume=0.01;
   audio.play().then(()=>{audioStarted=true;fadeAudio(0.78,650)}).catch(()=>{});
 };
 if(audio.readyState>=1)seekAndPlay();else audio.addEventListener("loadedmetadata",seekAndPlay,{once:true});
}
function fadeAudio(target,ms){
 const start=audio.volume,steps=16;let n=0;
 const tick=()=>{n++;audio.volume=Math.max(0,Math.min(1,start+(target-start)*n/steps));if(n<steps)setTimeout(tick,ms/steps)};tick();
}
startRandomTrack();
const unlockMusic=()=>{if(!audioStarted){startRandomTrack();}document.removeEventListener("pointerdown",unlockMusic);document.removeEventListener("keydown",unlockMusic)};
document.addEventListener("pointerdown",unlockMusic,{once:true});document.addEventListener("keydown",unlockMusic,{once:true});
audio.addEventListener("ended",()=>startRandomTrack());
function getStats(){try{return JSON.parse(localStorage.getItem('LS_WRAPPED_STATS_V1')||'{}')}catch(_){return{}}}
const s=getStats();
const mins=Math.floor((s.danceSeconds||0)/60),activeMins=Math.floor((s.activeSeconds||0)/60);
const kcal=Math.round(mins*5); // rough estimate only
const sessions=s.sessions||0,visits=s.visits||0,plays=s.plays||0,days=(s.days||[]).length;
const first=s.firstSeen?new Date(s.firstSeen):new Date();
const duration=mins>=60?Math.floor(mins/60)+'h '+mins%60+'m':mins+' min';
const activeDuration=activeMins>=60?Math.floor(activeMins/60)+'h '+activeMins%60+'m':activeMins+' min';
let coachDeck=shuffle(COACHES), lastCoach="";
function nextCoach(){if(!coachDeck.length)coachDeck=shuffle(COACHES);let c=coachDeck.pop();if(COACHES.length>1&&c===lastCoach&&coachDeck.length){coachDeck.unshift(c);c=coachDeck.pop()}lastCoach=c;return c;}
const slides=[
{eyebrow:'LEGACY SENSOR PRESENTS',big:'YOUR<br><span class="gradient">WRAPPED</span>',desc:'Your movement. Your moments. Your Legacy Sensor story so far.',pill:'A personal recap made on this device',cover:true},
{eyebrow:'YOU SHOWED UP',big:visits.toLocaleString(),desc:'WebApp visits recorded on this device. Every return is another chance to move.',label:'TOTAL VISITS'},
{eyebrow:'LET’S GET MOVING',big:plays.toLocaleString(),desc:'Times you started the camera from the WebApp. Your next session is waiting.',label:'PLAY STARTS'},
{eyebrow:'TIME IN MOTION',big:duration,desc:'Estimated time with the camera running while the WebApp was open. Your dance floor was ready.',label:'CAMERA ACTIVE TIME'},
{eyebrow:'A LITTLE EXTRA ENERGY',big:kcal.toLocaleString(),desc:'Approximate energy estimate based on camera-active time. Real calorie burn varies with body size and intensity.',label:'ESTIMATED KCAL'},
{eyebrow:'YOUR ROUTINE',big:sessions.toLocaleString(),desc:'Separate visits counted as sessions when you returned after a break. Keep building your own rhythm.',label:'SESSIONS'},
{eyebrow:'CONSISTENCY LOOKS GOOD',big:days.toLocaleString(),desc:'Different calendar days with activity recorded on this device. Small steps count too.',label:'ACTIVE DAYS'},
{eyebrow:'THAT’S YOUR RECAP',big:'KEEP<br><span class="gradient">DANCING</span>',desc:'Your story keeps growing every time you use Legacy Sensor. Come back later to see how your stats change.',pill:'Legacy Sensor by ItsVexor'}
];
let idx=0;
function esc(x){return String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function render(){
 const sl=slides[idx];let html='<div class="content"><div class="eyebrow">'+sl.eyebrow+'</div>';
 if(sl.cover)html+='<img class="cover-logo" src="assets/brand/watermark.png" alt="">';
 html+='<div class="big">'+sl.big+'</div><p class="desc">'+sl.desc+'</p>';
 if(sl.label)html+='<span class="pill">'+sl.label+'</span>';
 if(sl.pill)html+='<span class="pill">'+sl.pill+'</span>';
 if(idx===0)html+='<p class="note">Stats are stored locally on this device. This is your personal recap.</p>';
 if(idx===7)html+='<p class="note">Your story continues to grow. Save your recap whenever you like.</p>';
 html+='</div>';
 if(idx>0&&idx<7)html+='<div class="coach-halo"></div><img class="coach" src="'+nextCoach()+'" alt="" onerror="this.style.display=\'none\'">';
 $('card').innerHTML=html;$('progress').style.width=((idx+1)/slides.length*100)+'%';
 $('card').style.animation='none';void $('card').offsetWidth;$('card').style.animation='';
}
function advanceSlide(){idx=idx===slides.length-1?0:idx+1;render();startRandomTrack();}
// Tap/click the story itself to skip ahead; controls keep their own actions.
$("card").addEventListener("click",advanceSlide);document.querySelector(".stage").addEventListener("click",e=>{if(e.target.closest(".card")||e.target.closest("a,button"))return;advanceSlide()});
document.addEventListener("keydown",e=>{if(["ArrowRight"," ","Enter"].includes(e.key)&&!e.target.closest("button,a")){e.preventDefault();advanceSlide()}});
let slideTimer=setInterval(advanceSlide,30000);
function drawShareCard(){
 const c=document.createElement('canvas');c.width=1080;c.height=1350;const ctx=c.getContext('2d');
 const g=ctx.createLinearGradient(0,0,1080,1350);g.addColorStop(0,'#30105c');g.addColorStop(.52,'#a51b78');g.addColorStop(1,'#082f54');ctx.fillStyle=g;ctx.fillRect(0,0,c.width,c.height);
 // Decorative glow shapes
 ctx.globalAlpha=.22;for(let i=0;i<7;i++){ctx.beginPath();ctx.arc(900-i*80,120+i*125,160+i*8,0,Math.PI*2);ctx.fillStyle=i%2?'#42eaff':'#ff5ebd';ctx.fill()}ctx.globalAlpha=1;
 ctx.fillStyle='#ffffff';ctx.font='900 38px system-ui';ctx.fillText('LEGACY SENSOR',72,105);
 ctx.fillStyle='#ffb6e3';ctx.font='800 28px system-ui';ctx.fillText('MY PERSONAL WRAPPED',72,180);
 ctx.font='1000 104px system-ui';ctx.fillStyle='#fff';ctx.fillText('MY YEAR',72,310);ctx.fillText('IN MOTION',72,420);
 const stats=[['WEBAPP VISITS',visits.toLocaleString()],['PLAY STARTS',plays.toLocaleString()],['CAMERA ACTIVE',duration],['ESTIMATED KCAL',kcal.toLocaleString()],['SESSIONS',sessions.toLocaleString()],['ACTIVE DAYS',days.toLocaleString()]];
 stats.forEach((a,i)=>{const x=72+(i%2)*480,y=535+Math.floor(i/2)*190;ctx.fillStyle='#ffffff1f';ctx.beginPath();ctx.roundRect(x,y,420,145,22);ctx.fill();ctx.fillStyle='#ffc8e9';ctx.font='800 22px system-ui';ctx.fillText(a[0],x+25,y+42);ctx.fillStyle='#fff';ctx.font='1000 48px system-ui';ctx.fillText(a[1],x+25,y+100)});
 ctx.fillStyle='#ffffffb8';ctx.font='600 20px system-ui';ctx.fillText('Made with Legacy Sensor by ItsVexor',72,1260);
 return new Promise(resolve=>{const logo=new Image();logo.onload=()=>{try{ctx.drawImage(logo,900,38,100,100)}catch(_){}resolve(c)};logo.onerror=()=>resolve(c);logo.src='assets/brand/watermark.png'});
}
$('saveBtn').onclick=async()=>{const btn=$('saveBtn');btn.disabled=true;btn.textContent='Preparing image…';try{const canvas=await drawShareCard();const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));if(!blob)throw new Error('Could not create image');const file=new File([blob],'Legacy-Sensor-Wrapped.png',{type:'image/png'});if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'My Legacy Sensor Wrapped',text:'My Legacy Sensor recap'});}else{const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='Legacy-Sensor-Wrapped.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);btn.textContent='Saved image ✓';}}catch(e){if(e.name!=='AbortError')alert('Could not share automatically. Try Save to phone again or use a browser that supports image downloads.')}finally{btn.disabled=false;if(btn.textContent==='Preparing image…')btn.textContent='Save to phone ↗'}};

async function exportWrappedVideo(){
 const btn=$('videoBtn');
 if(!window.MediaRecorder||!HTMLCanvasElement.prototype.captureStream){alert('Video export is not supported in this browser. Try Chrome or Edge on desktop.');return;}
 btn.disabled=true;const old=btn.textContent;btn.textContent='Preparing video…';
 let recorder, chunks=[], audioCtx, source, dest, stream, raf=0;
 try{
  const canvas=document.createElement('canvas');canvas.width=1080;canvas.height=1920;const ctx=canvas.getContext('2d');
  const bg=new Image();bg.src='assets/wrapped-art/wrapped-background.png';
  const logo=new Image();logo.src='assets/brand/watermark.png';
  const coachImgs=COACHES.map(src=>{const im=new Image();im.src=src;return im});
  await Promise.all([new Promise(r=>{bg.onload=r;bg.onerror=r}),new Promise(r=>{logo.onload=r;logo.onerror=r})]);
  // Route the existing soundtrack into the recording stream while keeping normal playback.
  audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  source=audioCtx.createMediaElementSource(audio);dest=audioCtx.createMediaStreamDestination();source.connect(audioCtx.destination);source.connect(dest);await audioCtx.resume();
  stream=canvas.captureStream(30);dest.stream.getAudioTracks().forEach(t=>stream.addTrack(t));
  const mime=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(t=>MediaRecorder.isTypeSupported(t));
  if(!mime)throw new Error('This browser does not support a compatible video format.');
  recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:5000000});recorder.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  const finished=new Promise((resolve,reject)=>{recorder.onstop=resolve;recorder.onerror=()=>reject(new Error('Recording failed'))});
  const total=slides.length*30+5,start=performance.now();let lastSlide=-1;
  const roundRect=(x,y,w,h,r)=>{ctx.beginPath();ctx.roundRect(x,y,w,h,r)};
  function frame(now){
   const elapsed=(now-start)/1000, ending=elapsed>=slides.length*30, slideIndex=Math.min(slides.length-1,Math.floor(elapsed/30));
   ctx.clearRect(0,0,1080,1920);
   const grad=ctx.createLinearGradient(0,0,1080,1920);grad.addColorStop(0,'#170827');grad.addColorStop(.48,'#43105d');grad.addColorStop(1,'#071e3d');ctx.fillStyle=grad;ctx.fillRect(0,0,1080,1920);
   if(bg.complete&&bg.naturalWidth){ctx.save();ctx.globalAlpha=.18;ctx.filter='blur(8px)';ctx.drawImage(bg,0,0,1080,1920);ctx.restore()}
   for(let j=0;j<5;j++){ctx.beginPath();ctx.fillStyle=j%2?'#46e8ff18':'#ff2d9a20';ctx.arc(100+((j*237+elapsed*24)%1000),180+j*340,120+25*Math.sin(elapsed+j),0,Math.PI*2);ctx.fill()}
   if(ending){ctx.save();ctx.filter='blur(15px)';ctx.globalAlpha=.72;ctx.fillStyle='#fff';ctx.fillRect(0,0,1080,1920);ctx.restore();if(logo.complete&&logo.naturalWidth){ctx.shadowColor='#ff2d9a';ctx.shadowBlur=60;ctx.drawImage(logo,290,565,500,500);ctx.shadowBlur=0}ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='900 36px system-ui';ctx.fillText('LEGACY SENSOR',540,1160);ctx.font='600 24px system-ui';ctx.fillText('Thanks for dancing with us',540,1210);}
   else{
    const sl=slides[slideIndex];
    ctx.fillStyle='#ffffffb8';ctx.font='900 23px system-ui';ctx.textAlign='left';ctx.fillText('YOUR PERSONAL RECAP',64,90);
    if(logo.complete&&logo.naturalWidth)ctx.drawImage(logo,920,45,95,95);
    // Story progress bars
    for(let j=0;j<slides.length;j++){ctx.fillStyle='#ffffff38';roundRect(64+j*120,145,108,5,4);ctx.fill();if(j<slideIndex||j===slideIndex){ctx.fillStyle='#fff';roundRect(64+j*120,145,j===slideIndex?108*Math.min(1,(elapsed-slideIndex*30)/30):108,5,4);ctx.fill()}}
    ctx.save();roundRect(42,205,996,1500,46);ctx.fillStyle='#160d2cbb';ctx.fill();ctx.strokeStyle='#ff72d766';ctx.lineWidth=3;ctx.stroke();ctx.restore();
